[project]
name = "vietdub-local"
version = "0.1.0"
description = "VietDub Local companion (broker, translation, workers)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["services"]
testpaths = ["tests/python"]
asyncio_mode = "auto"
cache_dir = ".local/pytest_cache"
addopts = "-p no:cacheprovider"
