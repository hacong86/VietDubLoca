<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>__TITLE__ - YouTube</title>
<style>
  body { margin: 0; background: #0f0f0f; color: #fff; font-family: Roboto, Arial, sans-serif; }
  #movie_player { position: relative; width: 960px; height: 540px; background: #000; margin: 16px; }
  video.html5-main-video { width: 100%; height: 100%; }
  .ytp-chrome-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; justify-content: flex-end; background: linear-gradient(transparent, rgba(0,0,0,.7)); }
  .ytp-right-controls { display: flex; align-items: center; height: 48px; padding-right: 8px; }
  .ytp-button { background: none; border: 0; color: #fff; height: 48px; cursor: pointer; }
  .ytp-caption-window { position: absolute; bottom: 60px; width: 100%; text-align: center; font-size: 20px; }
  h1 { margin: 0 16px; font-size: 20px; }
</style>
</head>
<body>
<!-- Trang GIẢ LẬP cấu trúc player YouTube chỉ để kiểm thử tự động VietDub (không phải YouTube). -->
<div id="movie_player" class="html5-video-player">
  <video class="html5-main-video" src="/__vietdub_fake/video.mp4" preload="auto" playsinline></video>
  <div class="ytp-caption-window" id="ytcap"></div>
  <div class="ytp-chrome-bottom"><div class="ytp-right-controls"><button class="ytp-button ytp-subtitles-button" aria-pressed="false">CC</button></div></div>
</div>
<h1 class="title style-scope ytd-watch-metadata"><yt-formatted-string>__TITLE__</yt-formatted-string></h1>
<script>
(() => {
  // Như player thật khi điều hướng SPA: video hiện hành theo URL (?v=)
  const vidNow = () => new URLSearchParams(location.search).get('v') || '__VID__';
  const p = document.getElementById('movie_player');
  const v = p.querySelector('video');
  let ccTrack = null;
  const tracks = () => [{ baseUrl: 'https://www.youtube.com/api/timedtext?v=' + vidNow() + '&lang=en&caps=asr&xorb=2', languageCode: 'en', name: { simpleText: 'English' }, vssId: '.en' }];
  p.getPlayerResponse = () => ({ videoDetails: { videoId: vidNow(), title: document.title.replace(/ - YouTube$/, ''), lengthSeconds: String(Math.round(v.duration || 86)) },
    captions: { playerCaptionsTracklistRenderer: { captionTracks: tracks() } } });
  p.getVideoData = () => ({ video_id: vidNow(), title: document.title.replace(/ - YouTube$/, ''), isLive: false });
  p.loadModule = () => {};
  p.unloadModule = () => { ccTrack = null; };
  p.getOption = (m, k) => (k === 'track' ? (ccTrack || {}) : null);
  p.setOption = (m, k, val) => {
    if (m !== 'captions' || k !== 'track') return;
    ccTrack = val && val.languageCode ? val : null;
    if (!ccTrack) return;
    // Như player thật: tự tải timedtext kèm tham số chống bot (pot) bằng XHR
    const x = new XMLHttpRequest();
    x.open('GET', '/api/timedtext?v=' + vidNow() + '&lang=' + ccTrack.languageCode + '&fmt=json3&pot=FAKEPOT&c=WEB');
    x.send();
  };
})();
</script>
</body>
</html>
